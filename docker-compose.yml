name: order-management

services:
    database:
        container_name: database
        image: postgres:12.8
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - 5432:5432
        volumes:
            - db:/var/lib/postgresql/data

    app:
        container_name: app
        build: .
        depends_on:
            - database
        ports:
            - "8080:8080"
        restart: no
        env_file:
            - .env

volumes:
    db:
